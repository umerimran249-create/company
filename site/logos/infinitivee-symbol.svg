<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="32" viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Infinity Symbol -->
  <path d="M6 16C6 12.6863 8.68629 10 12 10C15.3137 10 18 12.6863 18 16C18 19.3137 15.3137 22 12 22C8.68629 22 6 19.3137 6 16ZM18 16C18 12.6863 20.6863 10 24 10C27.3137 10 30 12.6863 30 16C30 19.3137 27.3137 22 24 22C20.6863 22 18 19.3137 18 16Z" fill="url(#gradient1)" stroke="url(#gradient2)" stroke-width="1.5"/>
  
  <!-- Modern accent dots -->
  <circle cx="36" cy="16" r="1.5" fill="url(#gradient1)" opacity="0.8"/>
  <circle cx="40" cy="16" r="1" fill="url(#gradient1)" opacity="0.6"/>
  <circle cx="43" cy="16" r="0.5" fill="url(#gradient1)" opacity="0.4"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Apply subtle glow to infinity symbol -->
  <path d="M6 16C6 12.6863 8.68629 10 12 10C15.3137 10 18 12.6863 18 16C18 19.3137 15.3137 22 12 22C8.68629 22 6 19.3137 6 16ZM18 16C18 12.6863 20.6863 10 24 10C27.3137 10 30 12.6863 30 16C30 19.3137 27.3137 22 24 22C20.6863 22 18 19.3137 18 16Z" fill="none" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" opacity="0.4"/>
</svg> 